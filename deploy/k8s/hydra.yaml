# Ory Hydra — the OAuth2 authorization server. Public endpoints go through the
# ingress (auth.<domain>); the admin API is ClusterIP-only and MUST NOT be
# exposed. A one-shot Job runs schema migrations before the Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: hydra-migrate
  namespace: fastmail-mcp
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: oryd/hydra:v2.2.0
          args: ["migrate", "sql", "-e", "--yes"]
          env:
            - name: DSN
              valueFrom: { secretKeyRef: { name: fastmail-mcp-secrets, key: hydra-dsn } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  namespace: fastmail-mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: hydra }
  template:
    metadata:
      labels: { app: hydra }
    spec:
      containers:
        - name: hydra
          image: oryd/hydra:v2.2.0
          args: ["serve", "all"]
          env:
            - name: DSN
              valueFrom: { secretKeyRef: { name: fastmail-mcp-secrets, key: hydra-dsn } }
            - name: SECRETS_SYSTEM
              valueFrom: { secretKeyRef: { name: fastmail-mcp-secrets, key: hydra-system-secret } }
            - name: URLS_SELF_ISSUER
              value: "https://auth.radiosilence.dev"
            - name: URLS_LOGIN
              value: "https://mail.radiosilence.dev/auth/login"
            - name: URLS_CONSENT
              value: "https://mail.radiosilence.dev/auth/consent"
            - name: STRATEGIES_ACCESS_TOKEN
              value: "jwt"
            - name: SERVE_PUBLIC_CORS_ENABLED
              value: "true"
          ports:
            - { name: public, containerPort: 4444 }
            - { name: admin, containerPort: 4445 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4445 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Public endpoints — fronted by the ingress.
apiVersion: v1
kind: Service
metadata:
  name: hydra-public
  namespace: fastmail-mcp
spec:
  selector: { app: hydra }
  ports: [{ name: public, port: 4444, targetPort: 4444 }]
---
# Admin API — ClusterIP, reachable only from the service pods.
apiVersion: v1
kind: Service
metadata:
  name: hydra-admin
  namespace: fastmail-mcp
spec:
  type: ClusterIP
  selector: { app: hydra }
  ports: [{ name: admin, port: 4445, targetPort: 4445 }]
