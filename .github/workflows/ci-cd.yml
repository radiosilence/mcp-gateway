name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # radiosilence/mcp-gateway

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # The stylesheet is generated from the templates and committed, so the binary
  # embeds it and there is nothing to fetch at runtime. That only holds while the
  # committed copy matches its sources, which is what this checks.
  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Rebuild the stylesheet
        run: mise run css
      - name: Check it matches what is committed
        run: |
          git diff --exit-code -- assets/app.css || {
            echo "::error::assets/app.css is stale — run \`mise run css\` and commit the result"
            exit 1
          }

  # The Pulumi component in deploy/pulumi. Typechecked and tested like the
  # crate, and gating the publish below, so no chart is released that does not
  # compile against the API it exports.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - run: npm ci

      # One number for the gateway and the chart that deploys it, so a pin on
      # the package says exactly which gateway you get. Three files state it;
      # this is what stops them drifting.
      - name: Check the chart agrees with the crate
        run: |
          crate=$(grep -m1 '^version = ' ../../Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          pkg=$(node -p "require('./package.json').version")
          app=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' src/versions.ts)
          echo "Cargo.toml=$crate package.json=$pkg APP_VERSION=$app"
          [ "$crate" = "$pkg" ] && [ "$crate" = "$app" ] || {
            echo "::error::version mismatch — Cargo.toml=$crate package.json=$pkg APP_VERSION=$app"
            exit 1
          }

      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm run build

      # What gets published, not what got built. 0.8.0 shipped a tarball
      # holding package.json and a README: the build ran in this job and
      # `npm publish` ran in another, on another runner, with nothing to carry
      # `dist/` between them. `prepublishOnly` is the fix; this is what notices
      # if it ever stops working.
      - name: Check the tarball carries the build
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const missing = ["dist/index.js", "dist/index.d.ts"].filter(
              (f) => !files.includes(f),
            );
            if (missing.length) {
              console.error(`::error::tarball is missing ${missing.join(", ")}`);
              console.error(files.join("\n"));
              process.exit(1);
            }
            console.log(`${files.length} files, dist included`);
          '

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      major_minor: ${{ steps.check.outputs.major_minor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      # A push releases only when it changes the version. Comparing with the
      # latest GitHub release alone would let a push that lands while a release
      # is still running release the same version a second time. A manual run
      # releases whatever is unreleased.
      - name: Check if version changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          VERSION=$(version_of < Cargo.toml)
          PREVIOUS=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "Cargo.toml=$VERSION HEAD^=$PREVIOUS latest release=$LATEST"
          if [ "$VERSION" = "${LATEST#v}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

  # Compiles the musl binary and ships it straight into the image on the same
  # runner. Kept in one job so the binary never round-trips through the
  # artifact store, which would cost a runner handoff and drop its exec bit.
  # Runs on PRs too — only the registry push is main-gated, via PUBLISH. This
  # repo ships no binary artifacts, so nothing here is uploaded or attached to
  # a release; the image is the only deliverable.
  build-image:
    name: Build ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # musl-tools for the static target; cmake/clang for aws-lc-sys, the
      # rustls crypto backend, which is a C/C++ build.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from — and
          # a release target/ is the largest entry in the repository's 10GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mcp-gateway \
            dist/mcp-gateway-linux-${{ matrix.arch }}-musl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this still builds — it just discards the result instead of
      # pushing, so a broken Dockerfile fails before merge rather than after.
      # No cache-from/cache-to: nothing compiles in the image.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}

  create-manifest:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, format, changelog, assets, build-image, check-version]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create :main and :sha-<short> manifests
        run: |
          for tag in main "${{ steps.tags.outputs.sha_tag }}"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done

      # Moving majors/minors as well as the exact version, so a deployment can
      # choose how much it wants to follow.
      - name: Create semver manifests
        if: needs.check-version.outputs.should_release == 'true'
        run: |
          for tag in "v${{ needs.check-version.outputs.version }}" "v${{ needs.check-version.outputs.major_minor }}" "v${{ needs.check-version.outputs.major }}" latest; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done

  # Last, and only once the image it names is actually in the registry. A
  # release is a promise that something is pullable; cutting one beside the
  # build breaks that promise every time a build fails.
  # After create-manifest, for the reason create-release is: publishing the
  # chart is a promise that the image it pins is pullable, and a chart that
  # names an image nobody built is worse than no chart.
  publish-chart:
    name: Publish Chart
    runs-on: ubuntu-latest
    needs: [chart, check-version, create-manifest]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@radiosilence"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, lint, format, changelog, assets, chart, check-version, create-manifest, publish-chart]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.check-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      # Release writes go through RELEASE_TOKEN: GitHub answers the workflow
      # token's with "Resource not accessible by integration", contents: write
      # notwithstanding.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      # No binaries attached: this is a service, and the image is the artefact.
      # The action creates the tag through the API, on the commit that was
      # built; a re-run finds the release and tag and fills in what is missing.
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: notes.md
