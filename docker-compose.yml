# Full local end-to-end: Postgres + Ory Hydra (the AS) + this service.
# Add a custom connector in Claude pointing at http://localhost:8080/mcp and
# the whole OAuth dance runs locally.
#
# Prereq: copy .env.example → .env and fill GH_CLIENT_ID/SECRET (GitHub OAuth
# app with callback http://localhost:8080/auth/github/callback).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastmail
      POSTGRES_PASSWORD: fastmail
      POSTGRES_DB: fastmail_mcp
    volumes:
      - ./deploy/local/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmail -d fastmail_mcp"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: run Hydra's schema migrations before it serves.
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      DSN: postgres://fastmail:fastmail@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    environment:
      DSN: postgres://fastmail:fastmail@postgres:5432/hydra?sslmode=disable
      # Browser/Claude-facing issuer. Defaults to localhost; set HYDRA_ISSUER in
      # .env to a public tunnel hostname to test the Claude connector.
      URLS_SELF_ISSUER: ${HYDRA_ISSUER:-http://localhost:4444}
      # Login/consent providers live in *this* service (browser-facing URLs).
      URLS_LOGIN: ${PUBLIC_URL:-http://localhost:8080}/auth/login
      URLS_CONSENT: ${PUBLIC_URL:-http://localhost:8080}/auth/consent
      SECRETS_SYSTEM: dev-system-secret-change-me-at-least-32-chars
      # Opaque access tokens (default) — the service introspects them, so no
      # JWT ever reaches a client. Revocable at Hydra.
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "true"
      # Self-hosted Hydra OSS doesn't serve public DCR (that's an Ory Network
      # feature), and Claude rejects Hydra's DCR response anyway (empty
      # client_uri/logo_uri/tos_uri). So we advertise OUR /register as the
      # registration_endpoint; it proxies to Hydra's admin API and returns a
      # Claude-valid response.
      WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL: ${PUBLIC_URL:-http://localhost:8080}/register
      # TLS is terminated by the proxy (cloudflared/Traefik), so Hydra sees http
      # and won't mark cookies Secure. --dev sets SameSite=None, and browsers
      # drop None-without-Secure → "no CSRF value" 403. AS + gateway are the same
      # registrable domain, so SameSite=Lax is sufficient and avoids the Secure
      # requirement.
      SERVE_COOKIES_SAME_SITE_MODE: Lax
      LOG_LEVEL: info
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin (dev only — never expose in prod)
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # The generic gateway: OAuth + credential vault + dashboard + routing.
  gateway:
    build: .
    env_file: .env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Public URLs default to localhost; override in .env with tunnel hostnames
      # to test the Claude connector (see "Cloudflare tunnel" in the README).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://fastmail:fastmail@postgres:5432/fastmail_mcp
      # Issuer is what the browser/Claude use to reach Hydra (advertised in
      # metadata); admin is in-network, used for introspection + login/consent.
      HYDRA_ISSUER: ${HYDRA_ISSUER:-http://localhost:4444}
      HYDRA_ADMIN_URL: http://hydra:4445
      MCP_REGISTRY: /etc/mcp-gateway/mcps.json
    volumes:
      - ./mcps.json:/etc/mcp-gateway/mcps.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_started
      fastmail-mcp:
        condition: service_started
      caldav-mcp:
        condition: service_started

  # A backend MCP: fastmail-cli in HTTP mode. The gateway proxies /fastmail here
  # and injects X-Fastmail-Token. Internal only — no host port.
  #
  # The published image, same as production pulls: the CLI repos build their own
  # multi-arch images, so building them again here was a second definition of
  # the same thing, drifting from the first.
  fastmail-mcp:
    image: ghcr.io/radiosilence/fastmail-cli:v3.2.0
    command: ["mcp", "--http", "0.0.0.0:8080"]
    expose:
      - "8080"

  # A backend MCP: caldav-cli in HTTP mode, serving GraphQL alongside so the
  # dashboard can list an account's calendars. The gateway proxies /caldav here
  # and injects X-CalDAV-Username/-Password/-Url/-Calendar — CalDAV needs
  # several values rather than one bearer token, hence `fields` in the registry.
  # Internal only — no host port.
  caldav-mcp:
    image: ghcr.io/radiosilence/caldav-cli:v0.5.0
    command: ["mcp", "--http", "0.0.0.0:8080", "--graphql"]
    expose:
      - "8080"

  # Opt-in tunnel for Claude-connector testing. Don't run this directly — use
  # `mise run tunnel`, which provisions the tunnel + DNS, writes
  # cloudflared/{config.yml,creds.json} (gitignored, mounted below), and brings
  # the stack up with the right public URLs. One tunnel, two hostnames →
  # gateway:8080 + hydra:4444.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    profiles: ["tunnel"]
    restart: unless-stopped
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - gateway
      - hydra

volumes:
  pgdata:
