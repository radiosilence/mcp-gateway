[package]
name = "mcp-gateway"
version = "0.1.0"
edition = "2024"
description = "OAuth-fronted gateway for self-hosted MCP servers: one AS + credential vault + dashboard, routing to per-MCP backends with the right secret injected"
repository = "https://github.com/radiosilence/fastmail-mcp-service"
license = "MIT"

[[bin]]
name = "mcp-gateway"
path = "src/main.rs"

[dependencies]
# Generic gateway — it links no MCP; each MCP is a backend it proxies to.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"

# Storage
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "macros",
  "migrate",
  "time",
] }

# Crypto: envelope-encrypt the Fastmail token at rest
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"

# HTTP client for Hydra introspection/admin, GitHub OAuth, and proxying MCP
# traffic to backends (streaming responses for MCP's SSE).
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }

# Templating for the dashboard
askama = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
time = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
