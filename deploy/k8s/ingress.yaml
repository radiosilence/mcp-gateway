# Edge routing: two public hosts, TLS via cert-manager. Hydra's public API and
# the service are separate backends on separate hosts — the service never
# proxies Hydra's OAuth endpoints.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastmail-mcp
  namespace: fastmail-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mail.radiosilence.dev, auth.radiosilence.dev]
      secretName: fastmail-mcp-tls
  rules:
    - host: mail.radiosilence.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastmail-mcp-service
                port: { number: 8080 }
    - host: auth.radiosilence.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hydra-public
                port: { number: 4444 }
