[tools]
rust = { version = "1", components = "rustfmt,clippy" }
just = "latest"
actionlint = "1.7.12"
shellcheck = "0.11.0"
lefthook = "latest"
# Deps for the dev tasks below. (If `cloudflared` doesn't resolve, use
# "aqua:cloudflare/cloudflared".)
cloudflared = "latest"
jq = "latest"
# Exact, because the committed assets are checked against a rebuild in CI and
# aube versions differ in how they write the lockfile.
node = "24"
aube = "2.8.5"

[env]
# Dev hostnames (radiosilence.dev = dev; blit.cc = prod). Must be on a domain
# you have on Cloudflare. Override per-invocation:
# `GATEWAY_HOST=… AUTH_HOST=… mise run tunnel`.
GATEWAY_HOST = "mcp.radiosilence.dev"
AUTH_HOST = "auth.radiosilence.dev"
TUNNEL_NAME = "mcp-gateway-dev"
_.path = ["node_modules/.bin"]

[tasks.web]
description = "Rebuild assets/app.js and assets/app.css after changing web/ or a template"
run = "aube install --frozen-lockfile && rolldown -c && tailwindcss -i web/app.css -o assets/app.css --minify"

[tasks.web-check]
description = "Typecheck, lint and format-check web/"
run = "aube install --frozen-lockfile && tsc && oxlint --ignore-pattern 'web/vendor/datastar.js' web && oxfmt --check web/app.ts web/vendor/datastar.d.ts rolldown.config.ts"

[tasks.up]
description = "Run the stack locally on http://localhost:8080"
run = "docker compose up --build"

[tasks.down]
description = "Stop and remove the stack"
run = "docker compose down"

[tasks.logs]
description = "Tail all logs"
run = "docker compose logs -f"

[tasks.tunnel]
description = "Provision the Cloudflare tunnel (idempotent) and run behind it"
run = """
set -eu
mkdir -p cloudflared
[ -f "$HOME/.cloudflared/cert.pem" ] || cloudflared tunnel login
cloudflared tunnel list --output json | jq -e --arg n "$TUNNEL_NAME" '.[]|select(.name==$n)' >/dev/null || cloudflared tunnel create "$TUNNEL_NAME"
UUID=$(cloudflared tunnel list --output json | jq -r --arg n "$TUNNEL_NAME" '.[]|select(.name==$n)|.id')
cloudflared tunnel route dns "$TUNNEL_NAME" "$GATEWAY_HOST" || true
cloudflared tunnel route dns "$TUNNEL_NAME" "$AUTH_HOST" || true
rm -f cloudflared/creds.json cloudflared/config.yml
install -m 600 "$HOME/.cloudflared/$UUID.json" cloudflared/creds.json
cat > cloudflared/config.yml <<CFG
tunnel: $UUID
credentials-file: /etc/cloudflared/creds.json
ingress:
  - hostname: $GATEWAY_HOST
    service: http://gateway:8080
  - hostname: $AUTH_HOST
    service: http://hydra:4444
  - service: http_status:404
CFG
echo ">> GitHub OAuth app callback must be: https://$GATEWAY_HOST/auth/github/callback"
export PUBLIC_URL="https://$GATEWAY_HOST"
export HYDRA_ISSUER="https://$AUTH_HOST"
docker compose --profile tunnel up --build
"""

[tasks.verify]
description = "Check the OAuth discovery chain over the tunnel"
run = """
set -e
echo "== protected-resource (gateway) =="
curl -fsS "https://$GATEWAY_HOST/.well-known/oauth-protected-resource" | jq .
echo "== /fastmail (expect 401) =="
curl -s -o /dev/null -w "%{http_code}\\n" -X POST "https://$GATEWAY_HOST/fastmail" -H 'content-type: application/json' -d '{}'
echo "== /caldav (expect 401) =="
curl -s -o /dev/null -w "%{http_code}\\n" -X POST "https://$GATEWAY_HOST/caldav" -H 'content-type: application/json' -d '{}'
echo "== openid-configuration (hydra) =="
curl -fsS "https://$AUTH_HOST/.well-known/openid-configuration" | jq '{issuer,registration_endpoint,token_endpoint,jwks_uri}'
"""

[tasks.preview]
description = "Render the dashboard to a file and open it — how it looks, without a login"
run = """
out="${PREVIEW_OUT:-$(mktemp -d)/dashboard.html}"
PREVIEW_OUT="$out" cargo test --quiet write_preview -- --ignored
echo "$out"
open "$out" 2>/dev/null || true
"""
