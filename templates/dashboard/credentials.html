{#- The credential form; settings are saved on their own, outside it. -#}
{%- let form = kit::Form::post(url).id(self.id()) %}
<form {{ form.attrs() }} class="mt-3 grid gap-4">
  {%- for i in inputs %}
    {{ form.field(kit::Field::new(i.label, i.control()).hint(i.hint())) }}
  {%- endfor %}
  <div>{{ form.submit(kit::Button::primary(self.submit())) }}</div>
</form>
