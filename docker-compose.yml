# Full local end-to-end: Postgres + Ory Hydra (the AS) + this service.
# Add a custom connector in Claude pointing at http://localhost:8080/mcp and
# the whole OAuth dance runs locally.
#
# Prereq: copy .env.example → .env, and have the login provider (`auth`)
# running at AUTH_URL — this service stopped being it, so a dashboard login
# locally needs it up. Register this gateway as a client there and set
# OIDC_CLIENT_ID/SECRET.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcpgw
      POSTGRES_PASSWORD: mcpgw
      POSTGRES_DB: mcp_gateway
    volumes:
      - ./deploy/local/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpgw -d mcp_gateway"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: run Hydra's schema migrations before it serves.
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      DSN: postgres://mcpgw:mcpgw@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    environment:
      DSN: postgres://mcpgw:mcpgw@postgres:5432/hydra?sslmode=disable
      # Browser/Claude-facing issuer. Defaults to localhost; set HYDRA_ISSUER in
      # .env to a public tunnel hostname to test the Claude connector.
      URLS_SELF_ISSUER: ${HYDRA_ISSUER:-http://localhost:4444}
      # Login and consent are delegated to the provider, not to this service.
      # Hydra takes one for the whole authorization server, which is why it
      # cannot live inside a service that is merely one of its clients.
      URLS_LOGIN: ${AUTH_URL:-http://localhost:8082}/auth/login
      URLS_CONSENT: ${AUTH_URL:-http://localhost:8082}/auth/consent
      SECRETS_SYSTEM: dev-system-secret-change-me-at-least-32-chars
      # Opaque access tokens (default) — the service introspects them, so no
      # JWT ever reaches a client. Revocable at Hydra.
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "true"
      # Self-hosted Hydra OSS doesn't serve public DCR (that's an Ory Network
      # feature), and Claude rejects Hydra's DCR response anyway (empty
      # client_uri/logo_uri/tos_uri). The provider proxies it and returns a
      # Claude-valid response — this service used to, and no longer does.
      WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL: ${AUTH_URL:-http://localhost:8082}/register
      # TLS is terminated by the proxy (cloudflared/Traefik), so Hydra sees http
      # and won't mark cookies Secure. --dev sets SameSite=None, and browsers
      # drop None-without-Secure → "no CSRF value" 403. AS + gateway are the same
      # registrable domain, so SameSite=Lax is sufficient and avoids the Secure
      # requirement.
      SERVE_COOKIES_SAME_SITE_MODE: Lax
      LOG_LEVEL: info
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin (dev only — never expose in prod)
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # The generic gateway: OAuth + credential vault + dashboard + routing.
  gateway:
    build: .
    env_file: .env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Public URLs default to localhost; override in .env with tunnel hostnames
      # to test the Claude connector (see "Cloudflare tunnel" in the README).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://mcpgw:mcpgw@postgres:5432/mcp_gateway
      # Issuer is what the browser and Claude use to reach Hydra (advertised in
      # metadata, and where a dashboard login is sent); admin is in-network and
      # now only introspects.
      HYDRA_ISSUER: ${HYDRA_ISSUER:-http://localhost:4444}
      HYDRA_ADMIN_URL: http://hydra:4445
      # The registry: which MCPs this gateway fronts, what each one is called,
      # and what it needs from the user. The gateway ships none of its own — it
      # is the deployment's to define, so it arrives whole in the environment.
      # Here that deployment is this file, which is why the registry sits
      # beside the backend services it names.
      MCP_REGISTRY: |
        # Mail runs on an API token, but contacts go over CardDAV, which is a
        # separate protocol that rejects API tokens outright — so this needs
        # three values rather than one, and the two CardDAV ones are optional:
        # without them mail works and `contacts` doesn't, which the backend
        # reports as `session { carddavConfigured }` rather than failing a
        # query halfway through.
        - id: fastmail
          name: Fastmail
          backend: http://fastmail-mcp:8080/mcp
          key_help_url: https://app.fastmail.com/settings/security/tokens
          fields:
            - id: token
              label: API token
              header: X-Fastmail-Token
              hint: fmu1-…
            - id: username
              label: Username (contacts only)
              header: X-Fastmail-Username
              secret: false
              required: false
              hint: you@fastmail.com
            # An app password, not the API token above: CardDAV won't take one.
            - id: app_password
              label: App password (contacts only)
              header: X-Fastmail-App-Password
              required: false
              hint: Blank = mail works, contact search doesn't

        # CalDAV wants a username, a password and a server, not one bearer
        # token — hence `fields` rather than the `credential_header` shorthand.
        - id: caldav
          name: Calendar (CalDAV)
          backend: http://caldav-mcp:8080/mcp
          graphql: http://caldav-mcp:8080/graphql
          key_help_url: https://appleid.apple.com
          # Answers calmly rather than raising, so the three cases are told
          # apart: working, refused, and the server being unwell — which must
          # not read as a wrong password.
          verify:
            query: "{ viewer { status } }"
            path: viewer.status
            ok: CONNECTED
            rejected: INVALID_CREDENTIALS
          fields:
            - id: username
              label: Apple ID / username
              header: X-CalDAV-Username
              secret: false
              hint: you@icloud.com
            - id: password
              label: App-specific password
              header: X-CalDAV-Password
              hint: abcd-efgh-ijkl-mnop
            - id: url
              label: CalDAV server
              header: X-CalDAV-Url
              secret: false
              default: https://caldav.icloud.com
              required: false
            # Keyed by calendar id, not name: names are not unique, and this
            # value rides X-CalDAV-Calendar into every write.
            - id: calendar
              label: Default calendar for new events
              header: X-CalDAV-Calendar
              secret: false
              required: false
              hint: Blank = whichever calendar your calendar app uses
              options_query: "{ options: calendars(first: 100) { nodes { value: id label: name disabled: readOnly isDefault supportsEvents } } }"
              sync_mutation: "mutation($$value: String!) { setDefaultCalendar(id: $$value) { success error } }"

        # A public archive: nothing to authenticate to, nothing to store.
        - id: folk
          name: Folk (Mainly Norfolk)
          backend: http://folk-mcp:8080/mcp
          graphql: http://folk-mcp:8080/graphql
          public: true

        # TfL works anonymously; a key only raises the rate limit, so the one
        # field is optional and the MCP is usable the moment you log in.
        - id: tfl
          name: TfL (London transport)
          backend: http://tfl-mcp:8080/mcp
          graphql: http://tfl-mcp:8080/graphql
          key_help_url: https://api-portal.tfl.gov.uk/profile
          fields:
            - id: app_key
              label: TfL app key (optional — raises the rate limit)
              header: X-Tfl-App-Key
              required: false
              hint: 32 hex characters
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_started
      fastmail-mcp:
        condition: service_started
      caldav-mcp:
        condition: service_started

  # A backend MCP: fastmail-cli in HTTP mode. The gateway proxies /fastmail here
  # and injects X-Fastmail-Token. Internal only — no host port.
  #
  # The published image: the CLI repos build their own multi-arch images, so
  # building them again here was a second definition of the same thing.
  #
  # `main` rather than a version, because this is the dev loop — you want what
  # just landed. Production pins exact versions instead. `pull_policy: always`
  # because a floating tag on its own doesn't refresh: compose reuses whatever
  # it pulled first, which is the same silent staleness a cached build layer
  # gives you. Swap to `:latest` for the newest release instead of the newest
  # commit.
  fastmail-mcp:
    image: ghcr.io/radiosilence/fastmail-cli:main
    pull_policy: always
    command: ["mcp", "--http", "0.0.0.0:8080"]
    expose:
      - "8080"

  # A backend MCP: caldav-cli in HTTP mode, serving GraphQL alongside so the
  # dashboard can list an account's calendars. The gateway proxies /caldav here
  # and injects X-CalDAV-Username/-Password/-Url/-Calendar — CalDAV needs
  # several values rather than one bearer token, hence `fields` in the registry.
  # Internal only — no host port.
  caldav-mcp:
    image: ghcr.io/radiosilence/caldav-cli:main
    pull_policy: always
    command: ["mcp", "--http", "0.0.0.0:8080", "--graphql"]
    expose:
      - "8080"

  # The English folk archive, read-only. No credentials: mainlynorfolk.info is
  # a public website, so this is the registry's first `"public": true` entry —
  # it appears on the dashboard already connected, with no form to fill in.
  # `--graphql` alongside so the dashboard can reach the same schema a model
  # sees. The binary *is* the MCP server, so there is no `mcp` argument.
  folk-mcp:
    image: ghcr.io/radiosilence/mainlynorfolk-mcp:main
    pull_policy: always
    command: ["--http", "0.0.0.0:8080", "--graphql"]
    expose:
      - "8080"

  # TfL takes no key to work — anonymous callers get 50 requests/minute of the
  # same data — so it comes up usable and the key field only raises the limit.
  tfl-mcp:
    image: ghcr.io/radiosilence/tfl-cli:main
    pull_policy: always
    command: ["mcp", "--http", "0.0.0.0:8080", "--graphql"]
    expose:
      - "8080"

  # Opt-in tunnel for Claude-connector testing. Don't run this directly — use
  # `mise run tunnel`, which provisions the tunnel + DNS, writes
  # cloudflared/{config.yml,creds.json} (gitignored, mounted below), and brings
  # the stack up with the right public URLs. One tunnel, two hostnames →
  # gateway:8080 + hydra:4444.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    profiles: ["tunnel"]
    restart: unless-stopped
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - gateway
      - hydra

volumes:
  pgdata:
