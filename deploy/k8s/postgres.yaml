# Single Postgres instance, shared by the app (fastmail_mcp DB) and Hydra
# (hydra DB). State is deliberately disposable — no HA, small PVC. Losing it
# means users re-paste their Fastmail token.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fastmail-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fastmail-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: fastmail-mcp-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fastmail-mcp-secrets, key: postgres-password } }
            - name: POSTGRES_DB
              value: fastmail_mcp
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fastmail"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: fastmail-mcp
data:
  initdb.sql: |
    CREATE DATABASE hydra;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fastmail-mcp
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
