# TEMPLATE — do not commit real values. In jaritanet these come from the
# cluster secret manager (SOPS/sealed-secrets/Vault), not plain YAML.
#
# token-enc-key:  openssl rand -base64 32   (32 bytes, base64)
# session-secret: openssl rand -base64 48
# hydra-system-secret: openssl rand -hex 32 (>= 32 chars)
apiVersion: v1
kind: Secret
metadata:
  name: fastmail-mcp-secrets
  namespace: fastmail-mcp
type: Opaque
stringData:
  postgres-user: fastmail
  postgres-password: CHANGE_ME
  database-url: postgres://fastmail:CHANGE_ME@postgres:5432/fastmail_mcp
  hydra-dsn: postgres://fastmail:CHANGE_ME@postgres:5432/hydra?sslmode=disable
  hydra-system-secret: CHANGE_ME_AT_LEAST_32_CHARS
  token-enc-key: CHANGE_ME_BASE64_32_BYTES
  session-secret: CHANGE_ME_LONG_RANDOM
  github-client-id: CHANGE_ME
  github-client-secret: CHANGE_ME
