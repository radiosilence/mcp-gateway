name: CI/CD

# Build/publish modelled on radiosilence/nano-web (native per-arch runners, no
# QEMU). Auto-update modelled on radiosilence/blit (bump the jaritanet Pulumi
# tag on each build so the cluster rolls to the new image).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # radiosilence/jaritanet-mcp-gateway

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test
        run: cargo test --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  build-image:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    needs: [test, lint, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Push manifest
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Create :main and :sha-<short> manifests
        run: |
          for tag in main "${{ steps.tags.outputs.sha_tag }}"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done

  update-deployment:
    name: Bump jaritanet
    runs-on: ubuntu-latest
    needs: [manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOYMENT_REPO: radiosilence/jaritanet
      CONFIG_PATH: packages/infra/Pulumi.main.yaml
      SHA_TAG: ${{ needs.manifest.outputs.sha_tag }}
    steps:
      - name: Checkout jaritanet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEPLOYMENT_REPO }}
          token: ${{ secrets.DEPLOYMENT_PAT }}
      - name: Bump mcpGateway image tag in jaritanet
        run: |
          # Only bump if mcpGateway is already in jaritanet main — before PR #103
          # merges, yq would *create* a stub (no repository/hostname) that fails
          # jaritanet's config parse and breaks its deploy. Skip until then.
          if ! yq -e '.config."jaritanet:mcpGateway"' "$CONFIG_PATH" >/dev/null 2>&1; then
            echo "mcpGateway not in jaritanet main yet (PR #103 unmerged) — skipping."
            exit 0
          fi
          yq eval '(.config."jaritanet:mcpGateway".image.tag) = strenv(SHA_TAG)' -i "$CONFIG_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_PATH"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "🚀 mcp-gateway → $SHA_TAG"
          git push
