name: Build Container

permissions:
  contents: read
  packages: write

# Builds + pushes ghcr.io/radiosilence/mcp-gateway on main (tags: latest +
# sha-<short>) and on version tags (semver). jaritanet pins the sha it wants.
on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - "src/**"
      - "templates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/build.yml"

jobs:
  publish:
    name: Build and Publish
    uses: radiosilence/blit-workflows/.github/workflows/build-publish-container.yml@28e962429b331f0e39905f70ae10211b1db66349 # main
    with:
      image: "mcp-gateway"
    secrets:
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}
