{#- The credential form. Labels are the registry's, so they keep their case. -#}
{%- let form = kit::Form::post(url) %}
<form {{ form.attrs() }} class="mt-3 grid gap-4">
  {%- for i in inputs %}
  {{ kit::Field::new(i.label, i.control()).hint(i.hint()).class("normal-case") }}
  {%- endfor %}
  <div>{{ form.submit(kit::Button::primary(self.submit())) }}</div>
</form>
