[package]
name = "mcp-gateway"
version = "0.8.3"
edition = "2024"
description = "OAuth-fronted gateway for self-hosted MCP servers: one AS + credential vault + dashboard, routing to per-MCP backends with the right secret injected"
repository = "https://github.com/radiosilence/mcp-gateway"
license = "MIT"

[[bin]]
name = "mcp-gateway"
path = "src/main.rs"

[dependencies]
# Generic gateway — it links no MCP; each MCP is a backend it proxies to.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tower_governor = { version = "0.8", default-features = false, features = [
  "axum",
  "tracing",
] }
http = "1"

# Storage
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "postgres",
  "macros",
  "migrate",
  "time",
] }

# Crypto: envelope-encrypt stored credentials at rest
chacha20poly1305 = "0.11"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"

# HTTP client for Hydra introspection/admin, GitHub OAuth, and proxying MCP
# traffic to backends (streaming responses for MCP's SSE).
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "query",
  "rustls",
  "stream",
] }

# Templating for the dashboard
askama = "0.16"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
serde_norway = "0.9.42"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
